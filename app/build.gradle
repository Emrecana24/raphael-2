plugins { id 'com.android.application' }

android {
    namespace 'com.raphael.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.raphael.app"
        minSdk 26          // Android 8.0
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
// Bilerek HİÇ bağımlılık yok: APK çok küçük, derleme hızlı.
